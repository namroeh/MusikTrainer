# Testet die App und veröffentlicht sie auf GitHub Pages – bei jedem Push auf main.
# Einmalig nötig: Repository → Settings → Pages → Source: „GitHub Actions".
name: Veröffentlichen (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Unit-Tests – bricht auch ab, solange in src/about.ts noch Platzhalter stehen
      - name: Unit-Tests
        run: npm test

      - name: Browser für Abnahmetests installieren
        run: npx playwright install --with-deps chromium

      - name: Abnahmetests (Playwright)
        run: npm run test:e2e

      - name: Basis-Pfad bestimmen
        run: |
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          fi

      - name: Build für GitHub Pages
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
